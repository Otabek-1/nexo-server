services:
  api:
    build:
      context: .
    environment:
      APP_ENV: prod
      DEBUG: "false"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}"
      JWT_REFRESH_SECRET_KEY: "${JWT_REFRESH_SECRET_KEY:?JWT_REFRESH_SECRET_KEY must be set}"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set}"
      DB_SSLMODE: require
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:?CORS_ALLOW_ORIGINS must be set}"
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
